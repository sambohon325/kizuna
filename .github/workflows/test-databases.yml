name: Test Kizuna databases

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m app.schema_migrations
      - run: python -m alembic check

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kizuna
          POSTGRES_PASSWORD: kizuna-test
          POSTGRES_DB: kizuna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kizuna -d kizuna_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KIZUNA_DATABASE_URL: postgresql+psycopg://kizuna:kizuna-test@127.0.0.1:5432/kizuna_test
      KIZUNA_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]" "psycopg[binary]>=3.2,<4"
      - run: python -m app.schema_migrations
      - run: python -m alembic check
      - run: python -m pytest -q
      - run: python -m app.schema_migrations
      - run: python -m alembic check
