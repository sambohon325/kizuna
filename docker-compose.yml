services:
  migrate:
    build: .
    command: python -m app.schema_migrations
    exclude_from_hc: true
    environment:
      KIZUNA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kizuna}:${POSTGRES_PASSWORD:?Set a strong Postgres password}@postgres:5432/${POSTGRES_DB:-kizuna}
      KIZUNA_ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    expose:
      - "8000"
    environment:
      KIZUNA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kizuna}:${POSTGRES_PASSWORD:?Set a strong Postgres password}@postgres:5432/${POSTGRES_DB:-kizuna}
      KIZUNA_ENVIRONMENT: production
      KIZUNA_PUBLIC_URL: ${KIZUNA_PUBLIC_URL:?Set the full Kizuna app URL}
      KIZUNA_MARKETING_URL: ${KIZUNA_MARKETING_URL:-}
      KIZUNA_ACCOUNT_TOKEN_HOURS: ${KIZUNA_ACCOUNT_TOKEN_HOURS:-1}
      KIZUNA_ACCOUNT_EMAIL_LIMIT_PER_HOUR: ${KIZUNA_ACCOUNT_EMAIL_LIMIT_PER_HOUR:-5}
      KIZUNA_EMAIL_VERIFICATION_REQUIRED: ${KIZUNA_EMAIL_VERIFICATION_REQUIRED:-false}
      KIZUNA_BETA_INVITATION_DAYS: ${KIZUNA_BETA_INVITATION_DAYS:-7}
      KIZUNA_BETA_ACCESS_DAYS: ${KIZUNA_BETA_ACCESS_DAYS:-90}
      KIZUNA_ACCOUNT_STEWARD_SECRET: ${KIZUNA_ACCOUNT_STEWARD_SECRET:-}
      KIZUNA_ACCOUNT_STEWARD_ADMIN_EMAIL: ${KIZUNA_ACCOUNT_STEWARD_ADMIN_EMAIL:-}
      KIZUNA_ACCOUNT_STEWARD_CLOCK_SKEW_SECONDS: ${KIZUNA_ACCOUNT_STEWARD_CLOCK_SKEW_SECONDS:-300}
      KIZUNA_SMTP_HOST: ${KIZUNA_SMTP_HOST:-}
      KIZUNA_SMTP_PORT: ${KIZUNA_SMTP_PORT:-587}
      KIZUNA_SMTP_USERNAME: ${KIZUNA_SMTP_USERNAME:-}
      KIZUNA_SMTP_PASSWORD: ${KIZUNA_SMTP_PASSWORD:-}
      KIZUNA_SMTP_STARTTLS: ${KIZUNA_SMTP_STARTTLS:-true}
      KIZUNA_SMTP_SSL: ${KIZUNA_SMTP_SSL:-false}
      KIZUNA_SMTP_FROM_EMAIL: ${KIZUNA_SMTP_FROM_EMAIL:-}
      KIZUNA_SMTP_FROM_NAME: ${KIZUNA_SMTP_FROM_NAME:-Kizuna Studio}
      KIZUNA_TRIAL_DAYS: ${KIZUNA_TRIAL_DAYS:-7}
      KIZUNA_TRIAL_SIGNUP_ENABLED: ${KIZUNA_TRIAL_SIGNUP_ENABLED:-false}
      KIZUNA_TRIAL_SIGNUP_LIMIT_PER_HOUR: ${KIZUNA_TRIAL_SIGNUP_LIMIT_PER_HOUR:-5}
      KIZUNA_TRIAL_EXPORT_SECONDS: ${KIZUNA_TRIAL_EXPORT_SECONDS:-60}
      KIZUNA_TRIAL_WATERMARK: ${KIZUNA_TRIAL_WATERMARK:-KIZUNA TRIAL | kizuna.technology}
      KIZUNA_TURNSTILE_SITE_KEY: ${KIZUNA_TURNSTILE_SITE_KEY:-}
      KIZUNA_TURNSTILE_SECRET_KEY: ${KIZUNA_TURNSTILE_SECRET_KEY:-}
      KIZUNA_STRIPE_SECRET_KEY: ${KIZUNA_STRIPE_SECRET_KEY:-}
      KIZUNA_STRIPE_WEBHOOK_SECRET: ${KIZUNA_STRIPE_WEBHOOK_SECRET:-}
      KIZUNA_STRIPE_CREATOR_PRICE_ID: ${KIZUNA_STRIPE_CREATOR_PRICE_ID:-}
      KIZUNA_AUTH_REQUIRED: "true"
      KIZUNA_COOKIE_SECURE: "true"
      KIZUNA_BOOTSTRAP_ADMIN_KEY: ${KIZUNA_BOOTSTRAP_ADMIN_KEY:?Set a strong first-run studio setup key}
      KIZUNA_GENERATION_PROVIDER: ${KIZUNA_GENERATION_PROVIDER:-farm}
      KIZUNA_WORKER_ENROLLMENT_SECRET: ${KIZUNA_WORKER_ENROLLMENT_SECRET:?Set a strong worker enrollment secret}
      KIZUNA_RENDER_DIRECTORY: /app/renders
      KIZUNA_STORAGE_DIRECTORY: /app/storage
      KIZUNA_CLEANUP_VERIFICATION_HOURS: ${KIZUNA_CLEANUP_VERIFICATION_HOURS:-24}
      KIZUNA_REDIS_URL: redis://redis:6379/0
      KIZUNA_JOB_INLINE_FALLBACK: "false"
      KIZUNA_S3_BUCKET: ${KIZUNA_S3_BUCKET:-}
      KIZUNA_S3_ENDPOINT_URL: ${KIZUNA_S3_ENDPOINT_URL:-}
      KIZUNA_S3_REGION: ${KIZUNA_S3_REGION:-}
      KIZUNA_S3_PREFIX: ${KIZUNA_S3_PREFIX:-kizuna}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      KIZUNA_FFMPEG_PATH: /usr/bin/ffmpeg
      KIZUNA_SELF_HOSTED_SCANNER_API_KEY: ${KIZUNA_SELF_HOSTED_SCANNER_API_KEY:?Set a strong self-hosted scanner API key}
      KIZUNA_SCANNER_HEALTH_URL: http://compliance-scanner:8090/health
      KIZUNA_LOG_LEVEL: ${KIZUNA_LOG_LEVEL:-INFO}
      KIZUNA_SERVICE_HEARTBEAT_SECONDS: ${KIZUNA_SERVICE_HEARTBEAT_SECONDS:-15}
      KIZUNA_RESTORE_DRILL_INTERVAL_HOURS: ${KIZUNA_RESTORE_DRILL_INTERVAL_HOURS:-168}
      KIZUNA_SERVICE_STALE_SECONDS: ${KIZUNA_SERVICE_STALE_SECONDS:-60}
      KIZUNA_OPERATIONS_ALERT_EMAIL: ${KIZUNA_OPERATIONS_ALERT_EMAIL:-}
      KIZUNA_OPERATIONS_ALERT_WEBHOOK_URL: ${KIZUNA_OPERATIONS_ALERT_WEBHOOK_URL:-}
      KIZUNA_OPERATIONS_ALERT_WEBHOOK_SECRET: ${KIZUNA_OPERATIONS_ALERT_WEBHOOK_SECRET:-}
      KIZUNA_OPERATIONS_ALERT_MIN_SEVERITY: ${KIZUNA_OPERATIONS_ALERT_MIN_SEVERITY:-error}
      KIZUNA_OPERATIONS_ALERT_COOLDOWN_MINUTES: ${KIZUNA_OPERATIONS_ALERT_COOLDOWN_MINUTES:-360}
      KIZUNA_OPERATIONS_ALERT_RETRY_MINUTES: ${KIZUNA_OPERATIONS_ALERT_RETRY_MINUTES:-15}
      KIZUNA_OPERATIONS_ALERT_RETENTION_DAYS: ${KIZUNA_OPERATIONS_ALERT_RETENTION_DAYS:-90}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    volumes:
      - render_data:/app/renders
      - storage_data:/app/storage

  compliance-scanner:
    build: .
    command: uvicorn scanner.main:app --host 0.0.0.0 --port 8090
    environment:
      KIZUNA_SCANNER_CORPUS_DIRECTORY: /data/corpus
      KIZUNA_SCANNER_RENDER_DIRECTORY: /app/renders
      KIZUNA_SCANNER_STORAGE_DIRECTORY: /app/storage
      KIZUNA_SCANNER_FFMPEG_PATH: /usr/bin/ffmpeg
      KIZUNA_SCANNER_API_KEY: ${KIZUNA_SELF_HOSTED_SCANNER_API_KEY:?Set a strong self-hosted scanner API key}
      KIZUNA_SCANNER_ADMIN_KEY: ${KIZUNA_SCANNER_ADMIN_KEY:?Set a separate scanner administration key}
    volumes:
      - scanner_corpus:/data/corpus
      - render_data:/app/renders:ro
      - storage_data:/app/storage:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  job-worker:
    build: .
    command: python -m app.job_worker
    environment:
      KIZUNA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kizuna}:${POSTGRES_PASSWORD:?Set a strong Postgres password}@postgres:5432/${POSTGRES_DB:-kizuna}
      KIZUNA_ENVIRONMENT: production
      KIZUNA_REDIS_URL: redis://redis:6379/0
      KIZUNA_JOB_INLINE_FALLBACK: "false"
      KIZUNA_JOB_LEASE_SECONDS: ${KIZUNA_JOB_LEASE_SECONDS:-600}
      KIZUNA_JOB_POLL_SECONDS: ${KIZUNA_JOB_POLL_SECONDS:-2}
      KIZUNA_RENDER_DIRECTORY: /app/renders
      KIZUNA_STORAGE_DIRECTORY: /app/storage
      KIZUNA_FFMPEG_PATH: /usr/bin/ffmpeg
      KIZUNA_LOG_LEVEL: ${KIZUNA_LOG_LEVEL:-INFO}
      KIZUNA_SERVICE_HEARTBEAT_SECONDS: ${KIZUNA_SERVICE_HEARTBEAT_SECONDS:-15}
      KIZUNA_RESTORE_DRILL_INTERVAL_HOURS: ${KIZUNA_RESTORE_DRILL_INTERVAL_HOURS:-168}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - render_data:/app/renders
      - storage_data:/app/storage
    restart: unless-stopped

  backup-scheduler:
    build: .
    command: python -m app.backup_scheduler
    environment:
      KIZUNA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kizuna}:${POSTGRES_PASSWORD:?Set a strong Postgres password}@postgres:5432/${POSTGRES_DB:-kizuna}
      KIZUNA_ENVIRONMENT: production
      KIZUNA_PUBLIC_URL: ${KIZUNA_PUBLIC_URL:?Set the full Kizuna app URL}
      KIZUNA_REDIS_URL: redis://redis:6379/0
      KIZUNA_STORAGE_DIRECTORY: /app/storage
      KIZUNA_S3_BUCKET: ${KIZUNA_S3_BUCKET:-}
      KIZUNA_S3_ENDPOINT_URL: ${KIZUNA_S3_ENDPOINT_URL:-}
      KIZUNA_S3_REGION: ${KIZUNA_S3_REGION:-}
      KIZUNA_S3_PREFIX: ${KIZUNA_S3_PREFIX:-kizuna}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      KIZUNA_LOG_LEVEL: ${KIZUNA_LOG_LEVEL:-INFO}
      KIZUNA_SERVICE_HEARTBEAT_SECONDS: ${KIZUNA_SERVICE_HEARTBEAT_SECONDS:-15}
      KIZUNA_RESTORE_DRILL_INTERVAL_HOURS: ${KIZUNA_RESTORE_DRILL_INTERVAL_HOURS:-168}
      KIZUNA_SERVICE_STALE_SECONDS: ${KIZUNA_SERVICE_STALE_SECONDS:-60}
      KIZUNA_SMTP_HOST: ${KIZUNA_SMTP_HOST:-}
      KIZUNA_SMTP_PORT: ${KIZUNA_SMTP_PORT:-587}
      KIZUNA_SMTP_USERNAME: ${KIZUNA_SMTP_USERNAME:-}
      KIZUNA_SMTP_PASSWORD: ${KIZUNA_SMTP_PASSWORD:-}
      KIZUNA_SMTP_STARTTLS: ${KIZUNA_SMTP_STARTTLS:-true}
      KIZUNA_SMTP_SSL: ${KIZUNA_SMTP_SSL:-false}
      KIZUNA_SMTP_FROM_EMAIL: ${KIZUNA_SMTP_FROM_EMAIL:-}
      KIZUNA_SMTP_FROM_NAME: ${KIZUNA_SMTP_FROM_NAME:-Kizuna Studio}
      KIZUNA_OPERATIONS_ALERT_EMAIL: ${KIZUNA_OPERATIONS_ALERT_EMAIL:-}
      KIZUNA_OPERATIONS_ALERT_WEBHOOK_URL: ${KIZUNA_OPERATIONS_ALERT_WEBHOOK_URL:-}
      KIZUNA_OPERATIONS_ALERT_WEBHOOK_SECRET: ${KIZUNA_OPERATIONS_ALERT_WEBHOOK_SECRET:-}
      KIZUNA_OPERATIONS_ALERT_MIN_SEVERITY: ${KIZUNA_OPERATIONS_ALERT_MIN_SEVERITY:-error}
      KIZUNA_OPERATIONS_ALERT_COOLDOWN_MINUTES: ${KIZUNA_OPERATIONS_ALERT_COOLDOWN_MINUTES:-360}
      KIZUNA_OPERATIONS_ALERT_RETRY_MINUTES: ${KIZUNA_OPERATIONS_ALERT_RETRY_MINUTES:-15}
      KIZUNA_OPERATIONS_ALERT_RETENTION_DAYS: ${KIZUNA_OPERATIONS_ALERT_RETENTION_DAYS:-90}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - render_data:/app/renders
      - storage_data:/app/storage
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kizuna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong Postgres password}
      POSTGRES_DB: ${POSTGRES_DB:-kizuna}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kizuna}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  render_data:
  storage_data:
  scanner_corpus:
