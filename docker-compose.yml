services:
  web:
    build: .
    environment:
      KIZUNA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kizuna}:${POSTGRES_PASSWORD:-kizuna}@postgres:5432/${POSTGRES_DB:-kizuna}
      KIZUNA_ENVIRONMENT: production
      KIZUNA_GENERATION_PROVIDER: ${KIZUNA_GENERATION_PROVIDER:-farm}
      KIZUNA_WORKER_ENROLLMENT_SECRET: ${WORKER_ENROLLMENT_SECRET:?Set a strong worker enrollment secret}
      KIZUNA_RENDER_DIRECTORY: /app/renders
      KIZUNA_STORAGE_DIRECTORY: /app/storage
      KIZUNA_CLEANUP_VERIFICATION_HOURS: ${KIZUNA_CLEANUP_VERIFICATION_HOURS:-24}
      KIZUNA_REDIS_URL: redis://redis:6379/0
      KIZUNA_JOB_INLINE_FALLBACK: "false"
      KIZUNA_S3_BUCKET: ${KIZUNA_S3_BUCKET:-}
      KIZUNA_S3_ENDPOINT_URL: ${KIZUNA_S3_ENDPOINT_URL:-}
      KIZUNA_S3_REGION: ${KIZUNA_S3_REGION:-}
      KIZUNA_S3_PREFIX: ${KIZUNA_S3_PREFIX:-kizuna}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      KIZUNA_FFMPEG_PATH: /usr/bin/ffmpeg
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - render_data:/app/renders
      - storage_data:/app/storage

  job-worker:
    build: .
    command: python -m app.job_worker
    environment:
      KIZUNA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kizuna}:${POSTGRES_PASSWORD:-kizuna}@postgres:5432/${POSTGRES_DB:-kizuna}
      KIZUNA_ENVIRONMENT: production
      KIZUNA_REDIS_URL: redis://redis:6379/0
      KIZUNA_JOB_INLINE_FALLBACK: "false"
      KIZUNA_JOB_LEASE_SECONDS: ${KIZUNA_JOB_LEASE_SECONDS:-600}
      KIZUNA_JOB_POLL_SECONDS: ${KIZUNA_JOB_POLL_SECONDS:-2}
      KIZUNA_RENDER_DIRECTORY: /app/renders
      KIZUNA_STORAGE_DIRECTORY: /app/storage
      KIZUNA_FFMPEG_PATH: /usr/bin/ffmpeg
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - render_data:/app/renders
      - storage_data:/app/storage

  backup-scheduler:
    build: .
    command: python -m app.backup_scheduler
    environment:
      KIZUNA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kizuna}:${POSTGRES_PASSWORD:-kizuna}@postgres:5432/${POSTGRES_DB:-kizuna}
      KIZUNA_STORAGE_DIRECTORY: /app/storage
      KIZUNA_S3_BUCKET: ${KIZUNA_S3_BUCKET:-}
      KIZUNA_S3_ENDPOINT_URL: ${KIZUNA_S3_ENDPOINT_URL:-}
      KIZUNA_S3_REGION: ${KIZUNA_S3_REGION:-}
      KIZUNA_S3_PREFIX: ${KIZUNA_S3_PREFIX:-kizuna}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - render_data:/app/renders
      - storage_data:/app/storage

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kizuna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kizuna}
      POSTGRES_DB: ${POSTGRES_DB:-kizuna}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kizuna}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  render_data:
  storage_data:
